openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: On-demand help for selected passages
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/assist:
    post:
      operationId: geminiAssist
      tags: [gemini]
      summary: Help with a selected PDF passage
      description: Sends only the selected passage and short nearby context to Gemini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiAssistInput"
      responses:
        "200":
          description: Gemini answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiAssistResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiAssistError"
        "403":
          description: Request origin is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiAssistError"
        "429":
          description: Request rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiAssistError"
        "502":
          description: Gemini API request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiAssistError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiAssistError"
        "504":
          description: Gemini request timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiAssistError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GeminiAssistInput:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
          enum: [explain, simplify, translate]
        selectedText:
          type: string
          minLength: 1
          maxLength: 5000
        context:
          type: string
          maxLength: 1000
        targetLanguage:
          type: string
          minLength: 1
          maxLength: 60
      required: [action, selectedText, context]
    GeminiAssistResponse:
      type: object
      additionalProperties: false
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 12000
      required: [answer]
    GeminiAssistError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]

